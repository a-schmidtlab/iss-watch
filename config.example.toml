# ISS Watch – Konfiguration: ~/.config/iss-watch/config.toml
# Alle Werte sind optional. Ohne Datei verhält sich ISS Watch wie auf dem alten
# iss-Pi (nur ISS-Stream, X11, WLAN aus).

# --- wetterraspi5 (Raspberry Pi 5, Wayland/labwc) ---

# Wetter-Dashboard aus dem Repo wetterstation (Dienst wetter-web)
dashboard_url = "http://127.0.0.1:8080/kiosk.html"
# Spreefeld Energie (dritte Ansicht, leer = keine)
energy_url = "http://127.0.0.1:8080/energie-kiosk.html"
start_view = "weather"            # iss | weather | energy | off – nach jedem Start

# Automatischer Wechsel: aus, geschaltet wird nur mit dem Taster.
# Zum Einschalten: auto_cycle = true, Dauern in Sekunden
auto_cycle = false
cycle = [["iss", 60], ["weather", 30]]

# Taster an GPIO21 (Pin 40) gegen GND (Pin 39), unterste Reihe der Stiftleiste.
# Pin 1–10 sind am wetterraspi5 durch den NVMe-HAT belegt.
# Klick: ISS → Wetter → Energie → ISS, Doppelklick: Monitor aus, Klick in „Aus“: wieder an
button_gpio = 21

# WLAN ist hier die Reserve neben LAN und bleibt an
disable_wifi = false

# Bildschirm aus per DDC: Der Monitor geht in Standby, das HDMI-Signal bleibt an.
# Ohne Signal zeigt er sonst einen blauen Bildschirm. Bus: ddcutil detect
display_backend = "ddc"           # auto | vcgencmd | wlr-randr | ddc
ddc_bus = 13
# Nur für wlr-randr: um 180° gedreht (kanshi), muss beim Einschalten erhalten bleiben
output = "HDMI-A-1"
output_transform = "180"

# Nachtmodus: Bildschirm aus. Ein Tastendruck in der Nacht hebt ihn für diese Nacht auf.
sleep_start = 1
sleep_end = 6

# Stream
stream_url = "https://www.youtube.com/@sen/live"
ytdl_path = "~/.local/share/iss-watch/venv/bin/yt-dlp"
cookies = "~/projects/iss-watch/yt-cookies.txt"
